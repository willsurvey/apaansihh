# .github/workflows/screener.yml
# ============================================================
# SCREENER TRADER INDONESIA — GitHub Actions Workflow
# Jadwal : Senin-Jumat jam 11:00 UTC = 18:00 WIB
# Login  : Direct API login (STOCKBIT_USERNAME + STOCKBIT_PASSWORD)
# Python : 3.13
# ============================================================

name: Stock Screener IDX

on:
  # Cron otomatis: Senin-Jumat jam 11:00 UTC (18:00 WIB)
  schedule:
    - cron: "0 11 * * 1-5"

  # Manual trigger dari GitHub UI
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Sumber trigger (manual / cron)"
        required: false
        default: "manual"
      force_mode:
        description: "Override mode (YAHOO_ONLY / kosong=AUTO)"
        required: false
        default: ""

jobs:
  screening:
    name: Run Stock Screener
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Jakarta
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write  # Untuk commit hasil JSON ke repo

    steps:
      # -----------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2. Setup Python 3.13
      # -----------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # -----------------------------------------------------------
      # 3. Install dependencies
      # -----------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --no-cache-dir -r requirements.txt

      # -----------------------------------------------------------
      # 4. Jalankan screener
      #    Login otomatis via STOCKBIT_USERNAME + STOCKBIT_PASSWORD
      # -----------------------------------------------------------
      - name: Run screener
        env:
          STOCKBIT_USERNAME: ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD: ${{ secrets.STOCKBIT_PASSWORD }}
          GITHUB_ACTIONS: "true"
          FORCE_MODE: ${{ github.event.inputs.force_mode }}
        run: |
          echo "🚀 Memulai screening..."
          echo "Trigger : ${{ github.event.inputs.trigger_source || 'cron' }}"
          echo "Mode    : ${FORCE_MODE:-AUTO}"
          python screener.py
          echo "✅ Screening selesai"

      # -----------------------------------------------------------
      # 5. Commit hasil JSON ke repo
      # -----------------------------------------------------------
      - name: Commit screening results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name  "GitHub Actions Bot"

          git add latest_screening.json   2>/dev/null || true
          git add combined_screening.json 2>/dev/null || true
          git add watchlist_*.json        2>/dev/null || true
          git add screener.log            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ Tidak ada perubahan untuk di-commit"
          else
            TODAY=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "📊 Screening results — $TODAY [skip ci]"
            git push
            echo "✅ Hasil commit ke repo"
          fi

      # -----------------------------------------------------------
      # 6. Upload artifact untuk debugging
      # -----------------------------------------------------------
      - name: Upload screening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ github.run_number }}
          path: |
            latest_screening.json
            combined_screening.json
            watchlist_*.json
            screener.log
          retention-days: 7
          if-no-files-found: ignore

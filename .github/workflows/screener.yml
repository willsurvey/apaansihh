# .github/workflows/screener.yml
# ============================================================
# SCREENER TRADER INDONESIA — GitHub Actions Workflow
# Jadwal  : Senin-Jumat jam 11:00 UTC = 18:00 WIB
# Trigger : cron otomatis + manual dispatch
# Auth    : Direct API login (STOCKBIT_USERNAME + STOCKBIT_PASSWORD)
#           Tidak butuh Playwright, tidak butuh session file.
# Python  : 3.13 | numpy>=2.2.6,<2.3
#
# SETUP SECRETS (Settings → Secrets and variables → Actions):
#   STOCKBIT_USERNAME  — username/email akun Stockbit
#   STOCKBIT_PASSWORD  — password akun Stockbit
#   STOCKBIT_PLAYER_ID — (opsional) device player ID, bisa dikosongkan
# ============================================================

name: Stock Screener IDX

on:
  # Cron otomatis: Senin-Jumat jam 11:00 UTC = 18:00 WIB
  schedule:
    - cron: "0 11 * * 1-5"

  # Manual trigger dari GitHub UI
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Sumber trigger (manual / debug)"
        required: false
        default: "manual"
      force_mode:
        description: "Override mode (YAHOO_ONLY / kosong=AUTO)"
        required: false
        default: ""

jobs:
  screening:
    name: Run Stock Screener
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Jakarta        # Runner otomatis pakai WIB
      PYTHONIOENCODING: utf-8
    permissions:
      contents: write         # Untuk commit hasil JSON ke repo

    steps:
      # -----------------------------------------------------------
      # 1. Checkout repository
      # -----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------
      # 2. Setup Python 3.13
      #    pandas-ta >=0.4.71b0 memerlukan Python >=3.12
      # -----------------------------------------------------------
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # -----------------------------------------------------------
      # 3. Install Python dependencies
      #    --prefer-binary: cegah build from source (numpy/numba)
      # -----------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary --no-cache-dir -r requirements.txt

      # -----------------------------------------------------------
      # 4. Verifikasi koneksi auth Stockbit sebelum screening
      #    Gagal di sini = secrets belum diset, bukan bug screener
      # -----------------------------------------------------------
      - name: Verify Stockbit auth
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
        run: |
          python - <<'EOF'
          import os, sys, json, requests, base64, time

          username  = os.environ.get("STOCKBIT_USERNAME", "").strip()
          password  = os.environ.get("STOCKBIT_PASSWORD", "").strip()
          player_id = os.environ.get("STOCKBIT_PLAYER_ID", "").strip()

          if not username or not password:
              print("STOCKBIT_USERNAME/PASSWORD belum diset di Secrets!")
              print("Pergi ke: Settings -> Secrets and variables -> Actions")
              sys.exit(1)

          print(f"Login sebagai '{username[:3]}***'...")

          r = requests.post(
              "https://exodus.stockbit.com/login/v6/username",
              json={"player_id": player_id or "", "user": username, "password": password},
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/147.0.0.0",
                  "X-DeviceType": "Google Chrome", "X-Platform": "PC", "X-AppVersion": "3.17.2",
                  "Content-Type": "application/json", "Accept": "application/json",
                  "Accept-Language": "ID", "Origin": "https://stockbit.com",
              },
              timeout=30,
          )

          if r.status_code != 200:
              print(f"Login gagal: HTTP {r.status_code}")
              print(f"Response: {r.text[:200]}")
              sys.exit(1)

          token = (r.json().get("data",{}).get("login",{})
                           .get("token_data",{}).get("access",{}).get("token",""))
          if not token or len(token) < 100:
              print(f"Token tidak valid di response (len={len(token)})")
              sys.exit(1)

          try:
              parts = token.split(".")
              payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=="))
              exp = payload.get("exp", 0)
              remaining = (exp - time.time()) / 3600
              print(f"Login berhasil! Token valid {remaining:.1f} jam ({len(token)} chars)")
          except Exception:
              print(f"Login berhasil! Token len={len(token)}")
          EOF

      # -----------------------------------------------------------
      # 5. Jalankan screener utama
      # -----------------------------------------------------------
      - name: Run screener
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
          GITHUB_ACTIONS: "true"
          FORCE_MODE: ${{ github.event.inputs.force_mode }}
        run: |
          echo "Memulai screening..."
          echo "Trigger  : ${{ github.event.inputs.trigger_source || 'cron' }}"
          echo "Mode     : ${FORCE_MODE:-AUTO}"
          echo "Timestamp: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          python screener.py
          echo "Screening selesai"

      # -----------------------------------------------------------
      # 6. Commit hasil JSON ke repo
      # -----------------------------------------------------------
      - name: Commit screening results
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"

          git add latest_screening.json   2>/dev/null || true
          git add combined_screening.json 2>/dev/null || true
          git add watchlist_*.json        2>/dev/null || true
          git add screener.log            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan untuk di-commit"
          else
            TODAY=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "Screening results -- $TODAY [skip ci]"
            git push
            echo "Hasil di-commit ke repo"
          fi

      # -----------------------------------------------------------
      # 7. Upload artifacts untuk debugging
      # -----------------------------------------------------------
      - name: Upload screening artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-results-${{ github.run_number }}
          path: |
            latest_screening.json
            combined_screening.json
            watchlist_*.json
            screener.log
          retention-days: 7
          if-no-files-found: ignore

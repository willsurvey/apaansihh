name: Screener Trader Indonesia

on:
  schedule:
    # Setiap hari kerja jam 18:00 WIB = 11:00 UTC
    - cron: '0 11 * * 1-5'
  workflow_dispatch:  # Bisa dijalankan manual dari tab Actions

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            numpy pandas pandas-ta \
            requests yfinance \
            pyarrow fastparquet

      - name: Run screener
        env:
          STOCKBIT_USERNAME:  ${{ secrets.STOCKBIT_USERNAME }}
          STOCKBIT_PASSWORD:  ${{ secrets.STOCKBIT_PASSWORD }}
          # STOCKBIT_PLAYER_ID opsional — kosongkan jika tidak punya
          # STOCKBIT_PLAYER_ID: ${{ secrets.STOCKBIT_PLAYER_ID }}
        run: |
          python screener.py

      - name: Upload output JSON
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-result-${{ github.run_id }}
          path: |
            latest_screening.json
            combined_screening.json
            watchlist_*.json
            screener.log
          retention-days: 7

      - name: Commit output ke repo (opsional)
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_screening.json combined_screening.json || true
          git diff --staged --quiet || git commit -m "chore: update screening $(date +'%Y-%m-%d')"
          git push || true
